[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fashion-taxonomy"
version = "0.1.0"
description = "AI-powered fashion image taxonomy analyzer (OpenAI & Gemini vision), with a CLI and a Streamlit app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chintha" }]
keywords = ["fashion", "taxonomy", "ai", "vision", "openai", "gemini", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.50",
    "google-generativeai>=0.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "streamlit>=1.36",
    "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
fashion-taxonomy = "fashion_taxonomy.cli:main"

[project.urls]
Repository = "https://github.com/chintha-hub/Taxomony"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# The prompt is natural-language guidance; physical line length is irrelevant.
"src/fashion_taxonomy/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["fashion_taxonomy"]
mypy_path = "src"
